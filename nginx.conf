# ============================================================================
# nginx.conf —— ECS 反代示例（放在 /etc/nginx/conf.d/sku-spu.conf 或 http 块内）
# 作用：把公网 80/443 转发到本机 gunicorn(127.0.0.1:8092)，并可选配 HTTPS/域名。
# 若用 Docker，则 proxy_pass 指向容器映射端口（如 http://127.0.0.1:8092）。
# ============================================================================

server {
    listen 80;
    server_name sku-spu.your-domain.com;   # 换成你的域名；仅内网 IP 可删掉此行

    client_max_body_size 200m;             # 数据源文件可能较大，放大上传上限

    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
    }
}

